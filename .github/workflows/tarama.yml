name: BIST Sinyal Taraması

on:
  # GitHub'ın zamanlayıcısı saatlerce gecikebiliyor; asıl tetik cron-job.org (README'ye bak),
  # bu satır yedek olarak kalıyor.
  schedule:
    - cron: "*/15 7-15 * * 1-5"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Telegram'a test mesajı gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      # Sadece arkadaş kopyalarında (fork): ana projenin yeni kodunu al; kendi portföy/durum dosyaların değişmez.
      # Kapatmak için kendi deponda Variables'a KOD_GUNCELLE = hayir ekle. (Workflow dosyaları elle güncellenir.)
      - name: Ana projeden kodu güncelle
        if: github.repository != 'BoranZZ/Bist-signal' && vars.KOD_GUNCELLE != 'hayir'
        run: |
          git config user.name "bist-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch --depth=1 https://github.com/BoranZZ/Bist-signal.git main
          git checkout FETCH_HEAD -- '*.py' requirements.txt '*.md' takvim.json
          git add -A '*.py' requirements.txt '*.md' takvim.json
          git commit -m "Ana projeden kod guncellendi" || echo "kod zaten guncel"
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt
      - name: Taramayı çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test }}
          # Anahtar varsa boş kalır, tarama API'den okur (env değerleri herkese açık logun adım başlığında görünür). Anahtarsız kopyalarda eski yol.
          PORTFOY: ${{ secrets.KUMBARA_DEFTER_ANAHTAR == '' && vars.PORTFOY || '' }}
          ALARMLAR: ${{ secrets.KUMBARA_DEFTER_ANAHTAR == '' && vars.ALARMLAR || '' }}
          KUMBARA_KOPRU_URL: ${{ secrets.KUMBARA_KOPRU_URL }}   # yoksa Kumbara köprüsü atlanır
          KUMBARA_DEFTER_ANAHTAR: ${{ secrets.KUMBARA_DEFTER_ANAHTAR }}   # PORTFOY, ALARMLAR ve DEFTER'i API ile okumak için (yalnız Variables okuma izni); yoksa satışlar gitmez, portföy env'den gelir
        run: python tarama.py
      - name: Panoyu kaydet
        run: |
          git config user.name "bist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html durum.json gecmis.json gecmis.html oranlar.json bilanco.json kap.json oda.json oda.html makro.json
          git commit -m "Pano guncellendi" || echo "degisiklik yok"
          # bu arada repoya başka commit geldiyse üstüne ekle; çakışmada yeni üretilen dosyalar kazanır
          git pull --rebase -X theirs
          git push
