name: BIST Sinyal Taraması

on:
  schedule:
    - cron: "*/15 7-15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt
      - name: Taramayı çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python tarama.py
      - name: Panoyu kaydet
        run: |
          git config user.name "bist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html durum.json gecmis.json gecmis.html oranlar.json
          git commit -m "Pano guncellendi" || echo "degisiklik yok"
          git push
