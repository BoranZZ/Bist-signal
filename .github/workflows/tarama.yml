name: BIST Sinyal Taraması

on:
  # GitHub'ın zamanlayıcısı saatlerce gecikebiliyor; asıl tetik cron-job.org (README'ye bak),
  # bu satır yedek olarak kalıyor.
  schedule:
    - cron: "*/15 7-15 * * 1-5"
  workflow_dispatch:
    inputs:
      telegram_test:
        description: "Telegram'a test mesajı gönder"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: tarama
  cancel-in-progress: false

jobs:
  tarama:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kütüphaneleri kur
        run: pip install -r requirements.txt
      - name: Taramayı çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_TEST: ${{ inputs.telegram_test }}
          PORTFOY: ${{ vars.PORTFOY }}   # panodan otomatik yazılır (kullanıcı onayıyla variable)
        run: python tarama.py
      - name: Panoyu kaydet
        run: |
          git config user.name "bist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html durum.json gecmis.json gecmis.html oranlar.json
          git commit -m "Pano guncellendi" || echo "degisiklik yok"
          # bu arada repoya başka commit geldiyse üstüne ekle; çakışmada yeni üretilen dosyalar kazanır
          git pull --rebase -X theirs
          git push
